[project]
name = "sheetcut"
version = "0.1.0"
description = "Cut-feed program generation for transformer core sheet cutting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
sheetcut-api = "sheetcut.api.main:run"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.13",
    "types-openpyxl",
    "httpx>=0.27",
]
# Headless subset needed to drive legacy/ for golden recording (Phase 1).
legacy = [
    "pandas>=2",
    "numpy>=1.26",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetcut"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src"]
strict = true
exclude = ["legacy/"]
